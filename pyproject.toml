[project]
name = "mental-health-emotional-support-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "addict>=2.4.0",
    "datasets>=5.0.0",
    "fastapi>=0.138.1",
    "langchain>=1.3.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-dashscope>=0.1.8",
    "langchain-openai>=1.3.0",
    "modelscope>=1.37.1",
    "protobuf<=3.20.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.58.0",
    "uvicorn[standard]>=0.49.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-deepseek>=1.1.0",
    "fpdf2>=2.8.7",
    "python-docx>=1.2.0",
    "deepagents>=0.7.9",
]
[project.optional-dependencies]
# 开发和测试依赖（不安装到生产环境）
# 安装：pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",              # 测试框架
    "pytest-asyncio>=0.24.0",     # 让 pytest 支持 async def 测试函数
    "httpx>=0.28.0",              # 异步 HTTP 客户端（FastAPI 测试用）
    "aiosqlite>=0.20.0",          # SQLite 异步驱动（测试时替代 PostgreSQL）
    "ruff>=0.6.0",                # 极快的 Python linter + formatter（Rust 写的）
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

